# Grafana can be pointed at a data source by hand through its UI, but that setting would be lost
# on every pod restart. Provisioning it as a file makes the dashboard reproducible: a fresh
# deployment already knows where Prometheus lives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: atb
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: atb-credit-platform
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # In-cluster DNS again: Grafana reaches Prometheus by Service name, so neither
        # needs to be exposed outside the cluster to talk to each other.
        url: http://prometheus:9090
        isDefault: true
---
# LoadBalancer, unlike Prometheus: this is the one monitoring component a human actually opens,
# so it is published on localhost:3000.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: atb
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: atb-credit-platform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: atb
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: atb-credit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: atb-credit-platform
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          ports:
            - containerPort: 3000
          env:
            # Local monitoring only, never exposed beyond localhost. The password still comes
            # from a Secret rather than being written here, keeping the same rule as JWT_SECRET.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            # Nothing here should phone home or invite sign-ups.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
