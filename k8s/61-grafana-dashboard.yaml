# A dashboard clicked together in the UI lives in Grafana's own database, which sits on an
# emptyDir here — one pod restart and it is gone. Shipping it as a provisioned file makes it
# part of the manifests: it comes back with the deployment, and it is reviewable in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: atb
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: atb-credit-platform
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: atb
        orgId: 1
        folder: ATB
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
  namespace: atb
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: atb-credit-platform
data:
  atb-backend.json: |
    {
      "title": "ATB Credit Platform — Backend",
      "uid": "atb-backend",
      "tags": ["atb", "backend"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "Service up",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=\"backend\"}", "legendFormat": "backend", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": {
                    "0": { "text": "DOWN", "color": "red", "index": 0 },
                    "1": { "text": "UP", "color": "green", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Uptime",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "process_uptime_seconds{application=\"backend\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0 } },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Requests / sec",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{application=\"backend\"}[1m]))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "JVM heap used",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{application=\"backend\", area=\"heap\"})", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value" }
        },
        {
          "type": "timeseries",
          "title": "HTTP requests per endpoint",
          "description": "rate() turns the ever-growing counter into a per-second rate, which is what actually shows load.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "sum by (uri) (rate(http_server_requests_seconds_count{application=\"backend\"}[1m]))",
              "legendFormat": "{{uri}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        },
        {
          "type": "timeseries",
          "title": "Response time (avg per endpoint)",
          "description": "Sum of durations divided by the request count over the same window — the average latency.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "sum by (uri) (rate(http_server_requests_seconds_sum{application=\"backend\"}[1m])) / sum by (uri) (rate(http_server_requests_seconds_count{application=\"backend\"}[1m]))",
              "legendFormat": "{{uri}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        },
        {
          "type": "timeseries",
          "title": "JVM memory",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            { "expr": "sum by (area) (jvm_memory_used_bytes{application=\"backend\"})",
              "legendFormat": "{{area}} used", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "fillOpacity": 15, "lineWidth": 2 } } }
        },
        {
          "type": "timeseries",
          "title": "CPU & threads",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            { "expr": "process_cpu_usage{application=\"backend\"} * 100", "legendFormat": "CPU %", "refId": "A" },
            { "expr": "jvm_threads_live_threads{application=\"backend\"}", "legendFormat": "live threads", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        }
      ]
    }
